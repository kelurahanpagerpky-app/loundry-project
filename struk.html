<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Struk | MHC-Laundry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%22.9em%22 font-size=%2222%22>🧺</text></svg>" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen">

<div class="no-print sticky top-0 z-10 bg-[#0d1c2d] border-b border-white/5 px-4 py-3 flex items-center justify-between">
  <a href="pesanan.html" class="text-sm text-slate-300 hover:text-white flex items-center gap-1.5">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span> Kembali ke Pesanan
  </a>
  <div class="flex gap-2">
    <button id="btn-print" class="bg-[#00bcd4] hover:bg-cyan-500 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5">
      <span class="material-symbols-outlined text-[18px]">print</span> Cetak
    </button>
  </div>
</div>

<div class="flex justify-center py-8 px-4">
  <div id="ll-print-area" class="bg-white text-slate-900 w-full max-w-[320px] rounded-lg shadow-2xl p-5 font-mono text-[12.5px] leading-snug">
    <div id="receipt-body"></div>
  </div>
</div>

<p id="not-found" class="hidden text-center text-slate-400 text-sm">Pesanan tidak ditemukan.</p>

<script src="assets/js/db.js"></script>
<script>
  LL.requireAuth();

  LL.getDB().then((db) => {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const order = db.orders.find((o) => o.id === orderId);
  const settings = db.settings;

  if (!order) {
    document.getElementById('ll-print-area').classList.add('hidden');
    document.getElementById('not-found').classList.remove('hidden');
  } else {
    const cust = db.customers.find((c) => c.id === order.customerId);
    const itemsHtml = order.items
      .map(
        (it) => `
      <div class="flex justify-between gap-2">
        <span class="flex-1">${it.name}</span>
      </div>
      <div class="flex justify-between text-slate-600">
        <span>${it.qty} ${it.unit} x ${LL.fmtCurrency(it.price)}</span>
        <span>${LL.fmtCurrency(it.qty * it.price)}</span>
      </div>`
      )
      .join('');

    document.getElementById('receipt-body').innerHTML = `
      <div class="text-center mb-3">
        <p class="font-bold text-sm uppercase">${settings.storeName}</p>
        <p class="text-[10px]">${settings.tagline}</p>
        <p class="text-[10px]">${settings.address}</p>
        <p class="text-[10px]">${settings.phone}</p>
      </div>
      <div class="border-t border-dashed border-slate-400 my-2"></div>
      <div class="flex justify-between"><span>No. Invoice</span><span>${order.id}</span></div>
      <div class="flex justify-between"><span>Tanggal</span><span>${LL.fmtDate(order.createdAt)}</span></div>
      <div class="flex justify-between"><span>Estimasi Selesai</span><span>${LL.fmtDate(order.dueAt)}</span></div>
      <div class="flex justify-between"><span>Pelanggan</span><span class="text-right">${cust ? cust.name : '-'}</span></div>
      <div class="flex justify-between"><span>Telepon</span><span>${cust ? cust.phone : '-'}</span></div>
      <div class="border-t border-dashed border-slate-400 my-2"></div>
      ${itemsHtml}
      <div class="border-t border-dashed border-slate-400 my-2"></div>
      <div class="flex justify-between font-bold text-sm"><span>TOTAL</span><span>${LL.fmtCurrency(order.total)}</span></div>
      <div class="flex justify-between"><span>Status</span><span>${order.status}</span></div>
      <div class="flex justify-between"><span>Pembayaran</span><span>${order.paymentStatus}</span></div>
      ${order.notes ? `<div class="border-t border-dashed border-slate-400 my-2"></div><p class="text-[11px]">Catatan: ${order.notes}</p>` : ''}
      <div class="border-t border-dashed border-slate-400 my-2"></div>
      <p class="text-center text-[10px] mt-2">${settings.invoiceFooter}</p>
    `;
  }
  }).catch((err) => {
    document.getElementById('ll-print-area').classList.add('hidden');
    const nf = document.getElementById('not-found');
    nf.textContent = 'Gagal memuat data pesanan: ' + err.message;
    nf.classList.remove('hidden');
  });

  document.getElementById('btn-print').addEventListener('click', () => window.print());
</script>
</body>
</html>
